spring.application.name=dbee-spring
server.port=${PORT:3000}

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:dbee}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE

app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:8000}
app.jwt-secret=${JWT_SECRET:}
app.jwt-cookie-name=${JWT_COOKIE_NAME:dbee_token}
app.jwt-expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.cookie-secure=${COOKIE_SECURE:false}
app.dialogflow-project-id=${DIALOGFLOW_PROJECT_ID:}
app.dialogflow-language-code=${DIALOGFLOW_LANGUAGE_CODE:en}
